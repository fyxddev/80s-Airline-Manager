<!DOCTYPE html>
<html lang="en">
<head>

<script>
/* Appearance settings (theme + style), shared by index.html and game.html */
(function(){var K='airline-manager-settings',d=document.documentElement,m=matchMedia('(prefers-color-scheme: dark)'),D={theme:'auto',style:'liquid'};
function get(){try{return Object.assign({},D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){return Object.assign({},D)}}
function apply(){var s=get();d.dataset.theme=s.theme==='auto'?(m.matches?'dark':'light'):s.theme;d.dataset.style=s.style==='minimal'?'minimal':'liquid'}
window.AMS={get:get,set:function(k,v){var s=get();s[k]=v;try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}apply()}};
if(m.addEventListener)m.addEventListener('change',apply);apply()})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header><div class="brand"><div class="logo"><i class="fi fi-sr-plane-departure"></i></div><div class="name" id="hName"></div></div><div class="cash num" id="hCash"></div></header>
  <div class="stats" id="hStats"></div>
  <main id="view"></main>
</div>
<nav id="nav"></nav>
<div id="ov"><div class="dlg" id="dlg"></div></div>
<script>
// ==================== DATA (data/*.json) ====================
let HUBS=[],COUNTRIES=[],AIRCRAFT=[],FAMILIES={},MAKERS={};
const flag=iso=>String.fromCodePoint(...[...iso].map(c=>127397+c.charCodeAt(0)));
const SELL_RATE=.6,SPEED=4,SAVE_KEY='airline-manager-save-v7',WEEK=10080,STEP=30,TURN=60,TA_MIN=30,DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],PM={Y:1,W:1.6,C:3.2};
const $=s=>document.querySelector(s),fmt=n=>{const a=Math.abs(n),g=n<0?'-$':'$';return a>=1e9?g+(a/1e9).toFixed(2)+'B':a>=1e8?g+(a/1e6).toFixed(1)+'M':a>=1e6?g+(a/1e6).toFixed(2)+'M':a>=1e4?g+Math.round(a/1e3)+'K':g+Math.round(a).toLocaleString('en-US')},fmtN=n=>Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hub=id=>HUBS.find(h=>h.id===id),country=iso=>COUNTRIES.find(c=>c.iso===iso),model=id=>AIRCRAFT.find(a=>a.id===id);
const plane=id=>S.planes.find(p=>p.id===id),route=id=>S.routes.find(r=>r.id===id);

// ==================== STATE ====================
const fresh=()=>({started:false,cash:100000000,vault:0,totalRevenue:0,airlineName:'Sky Pacific Airlines',homeCountry:'ID',history:{nw:[],rev:[]},hubs:{},hubStat:{},routes:[],nextRouteId:1,planes:[],nextPlaneId:1,regCounter:{},clock:540,pending:[],cfgs:{},seq:0});
let S=fresh();
const UI={tab:'home',owned:'routes',buy:'hubs',q:'',maker:null,openAc:'',openSort:'dem_desc',rotMode:'both',rotErr:'',drafts:{},buyQ:1,refit:null,open:{},openM:{},page:null,rangeHub:null,rangeKm:3000,sel:false,picked:{}};
function save(){if(!window.READY)return;S.savedAt=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;S=Object.assign(fresh(),JSON.parse(raw));S.planes=S.planes.filter(p=>model(p.modelId));S.planes.forEach(p=>p.sched=p.sched||[]);S.routes.forEach(r=>{if(r.demand&&r.demand.L==null)r.demand=calcDemand(r,r.week||0)})}catch(e){S=fresh()}}
function resetGame(){confirmDlg('New airline?','Your current progress will be deleted.','Start over',()=>{try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.href='index.html'},true)}

// ==================== HELPERS ====================
const ownedHubs=()=>Object.keys(S.hubs);
const CLS='ABCDEF',clsIdx=c=>CLS.indexOf(c),okCls=(m,r)=>clsIdx(hub(r.from).cls)>=clsIdx(m.cls)&&clsIdx(hub(r.to).cls)>=clsIdx(m.cls);
const airlineCode=()=>(S.airlineName.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase()||'AM');
const flightNos=r=>[airlineCode()+(5249+2*r.id),airlineCode()+(5250+2*r.id)];
const hubName=h=>`${h.flag} ${esc(h.city)} <span class="s">${h.code} · ${h.icao}</span> <span class="tag">Code ${h.cls}</span>`;
const dem=h=>`${h.demand.toFixed(1)} · ${fmtN(h.demand*1000)} pax`;
function dist(a,b){const A=hub(a),B=hub(b),r=x=>x*Math.PI/180,dl=r(B.lat-A.lat),dn=r(B.lon-A.lon);const h=Math.sin(dl/2)**2+Math.cos(r(A.lat))*Math.cos(r(B.lat))*Math.sin(dn/2)**2;return Math.round(12742*Math.asin(Math.sqrt(h)))}
function baseTicket(d){let b=d*.12;if(d>5000)b*=1.15;if(d>9000)b*=1.3;return Math.max(80,Math.round(b))}
const ticketRange=d=>{const b=baseTicket(d);return{min:Math.round(b*.7),max:Math.round(b*1.6),step:Math.max(1,Math.round(b*.02))}};
const fm=(d,spd)=>Math.round((d/spd*60+25)/5)*5;
const hhmm=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dur=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
const clockStr=t=>DAYS[Math.floor(t/1440)%7]+' '+hhmm(t);
function newReg(){const c=country(S.homeCountry),n=(S.regCounter[S.homeCountry]||0)+1;S.regCounter[S.homeCountry]=n;if(c.prefix==='N')return 'N'+(100+n);if(c.prefix==='CCCP')return 'CCCP-'+(65000+n);const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='',k=n;for(let i=0;i<3;i++){s=L[k%24]+s;k=Math.floor(k/24)}return c.prefix+'-'+s}

// ---- dynamic demand: differs per route and shifts every week
const routeM=(a,b,d)=>Math.round(1000*Math.sqrt(hub(a).demand*hub(b).demand)/(1+d/8000));
function rnd(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}h^=h>>>13;h=Math.imul(h,1274126177);return((h^h>>>16)>>>0)/4294967296}
function calcDemand(r,week){
  const k=r.from+'>'+r.to,base=routeM(r.from,r.to,r.distance)/4.345;
  const f=(.75+.5*rnd(k))*(1+.15*Math.sin(2*Math.PI*(week/52+rnd(k+'p'))))*(1+(rnd(k+week)-.5)*.14);
  const T=Math.max(20,Math.round(base*f)),C=Math.round(T*(.03+.06*rnd(k+'c'))),W=Math.round(T*(.04+.04*rnd(k+'w')));
  const cf=(.6+.8*rnd(k+'cg'))*(1+.18*Math.sin(2*Math.PI*(week/26+rnd(k+'q'))))*(1+(rnd(k+week+'g')-.5)*.2),CT=Math.max(2,Math.round(T*.032*cf)),L=Math.round(CT*(.5+.2*rnd(k+'l')));
  return{Y:T-C-W,W,C,L,M:CT-L};
}
const sumD=d=>d.Y+d.W+d.C;
function newWeek(r,w){r.week=w;r.demand=calcDemand(r,w)}
const openCost=(from,to,d)=>Math.max(250000,Math.round((150000+routeM(from,to,d)/4.345*125)/10000)*10000);

// ---- aircraft / flights
const clone=o=>JSON.parse(JSON.stringify(o));
const cargoCap=m=>Math.max(1,Math.round(.012*Math.pow(m.seats,1.15)));
function fixCfg(c,m){if(!c.L){const cc=cargoCap(m),l=Math.round(cc/2);c.L={n:l};c.M={n:cc-l}}return c}
const KEYS=['F','C','W','Y'],CNAME={F:'First',C:'Business',W:'Premium eco.',Y:'Economy'},PMUL={Y:1,W:1.6,C:3.2,F:6},SC=1;
// [name, price per seat, comfort rating, space factor (C/F)]
const PROD={Y:[['Super Slim',2000,40],['Slim',2500,52],['Standard',3000,64],['Comfort',4000,70],['Luxury',5000,76]],W:[['Basic',7000,73],['Standard',7500,80],['Comfort',8000,87],['Luxury',8500,94]],C:[['European',6000,70,1.5],['Regional',8000,82,2],['Full Flat',20000,98,3.5],['Parallel Flat',22000,102,3.8],['Staggered',25000,104,4],['Reverse Herringbone',30000,107,4.2]],F:[['Regional',12000,100,4],['Solo Suite',40000,108,6],['Open Suite',40000,110,6.5]]};
const SPACE={Y:p=>p.pt/30,W:p=>1.6*p.pt/36,C:p=>PROD.C[p.p][3],F:p=>PROD.F[p.p][3]};
const rate=(k,p)=>{const b=PROD[k][p.p][2];return Math.max(0,Math.min(120,Math.round(k==='Y'?b+(p.pt-30)*3:k==='W'?b+(p.pt-36)*2.5:b)))};
const seatsOf=c=>KEYS.reduce((n,k)=>n+c[k].n,0),usedSpace=c=>KEYS.reduce((n,k)=>n+c[k].n*SPACE[k](c[k]),0);
const cfgCost=c=>Math.round((KEYS.reduce((n,k)=>n+c[k].n*PROD[k][c[k].p][1],0)+(c.L?c.L.n*8000+c.M.n*12000:0))*SC);
const cfgStr=c=>KEYS.filter(k=>c[k].n).map(k=>k+c[k].n).join(' / ')+(c.L&&c.L.n+c.M.n?` · ${c.L.n+c.M.n}t cargo`:'');
function defaultCfg(m){const c={F:{n:0,p:0},C:{n:0,p:0},W:{n:0,p:0,pt:36},Y:{n:0,p:2,pt:30}};if(m.seats>80){c.C={n:Math.round(m.seats*.05),p:1};c.W={n:Math.round(m.seats*.06),p:0,pt:36}}c.Y.n=Math.floor(m.seats-usedSpace(c));const cc=cargoCap(m),l=Math.round(cc/2);c.L={n:l};c.M={n:cc-l};return c}
function fitCfg(c,cap){for(const k of ['Y','W','C','F'])while(usedSpace(c)>cap+1e-6&&c[k].n>0)c[k].n--}
const cfgOf=p=>fixCfg(p.cfg||(p.cfg=defaultCfg(model(p.modelId))),model(p.modelId));
const FR={Y:1,W:1.79,C:3.93,F:7.5,L:8.5,M:4.5},taOf=s=>s.ta??TURN,pad=n=>String(n).padStart(2,'0');
const defFares=d=>{const b=baseTicket(d);return{Y:b,W:Math.round(b*FR.W),C:Math.round(b*FR.C),F:Math.round(b*FR.F),L:Math.round(b*FR.L),M:Math.round(b*FR.M)}};
const fareOf=r=>{if(!r.fares)r.fares={...defFares(r.distance),...(r.ticket?{Y:r.ticket}:{})};if(r.fares.L==null){const d=defFares(r.distance);r.fares.L=d.L;r.fares.M=d.M}return r.fares};
const lfk=(r,k)=>Math.min(.98,.78*Math.pow(baseTicket(r.distance)*FR[k]/fareOf(r)[k],1.3));
const lf=r=>lfk(r,'Y');
const legCost=(m,r)=>Math.round(m.fuel*(2+8*r.distance/2000));
const legCap=(m,r,cfg)=>{const c={};for(const k of ['Y','W','C','F'])c[k]=Math.round(cfg[k].n*Math.min(.98,lfk(r,k)*(.7+rate(k,cfg[k])/213)));for(const k of ['L','M'])c[k]=cfg[k].n*Math.min(.98,lfk(r,k));return c};
// Each rotation (oldest first) takes its weekly passengers out of the route demand, like subtraction.
// Later rotations only get what is left, and earlier ones never lose passengers to them.
let ALCACHE=null;
function alloc(r){if(ALCACHE&&ALCACHE.has(r.id))return ALCACHE.get(r.id);const res=allocCalc(r);if(ALCACHE)ALCACHE.set(r.id,res);return res}
function allocCalc(r){
  const rem={...r.demand},out=new Map(),items=[],f=fareOf(r);
  S.planes.forEach(p=>p.sched.forEach(s=>{if(s.rid===r.id)items.push([p,s])}));
  items.sort((a,b)=>(a[1].seq||0)-(b[1].seq||0));
  for(const [p,s] of items){const m=model(p.modelId),cap=legCap(m,r,cfgOf(p)),legs=dayCount(s)*2,pax={};let rev=0;
    for(const k of ['Y','W','C','F','L','M']){const pool=k==='F'?'C':k,av=k==='L'||k==='M'?rem[pool]:Math.floor(rem[pool]),w=Math.max(0,Math.min(legs*cap[k],av));rem[pool]-=w;pax[k]=legs?w/legs:0;rev+=w*f[k]}
    out.set(s,{pax,rev,legs,cost:legs*legCost(m,r)})}
  return{out,rem};
}
const dayCount=s=>s.days.filter(Boolean).length;
const legsWeek=r=>S.planes.reduce((n,p)=>n+p.sched.filter(s=>s.rid===r.id).reduce((a,s)=>a+dayCount(s)*2,0),0);
function rotProfit(p,s){const r=route(s.rid),a=r&&alloc(r).out.get(s);return a?a.rev-a.cost:0}
function capLine(r){const cap=S.planes.reduce((n,p)=>n+p.sched.filter(s=>s.rid===r.id).reduce((a,s)=>a+dayCount(s)*2*seatsOf(cfgOf(p)),0),0),T=sumD(r.demand),ratio=T?cap*.78/T:0,over=ratio>1.15;
  return `<div class="row s" style="margin-top:12px"><span>Capacity ${fmtN(cap)} seats/wk vs demand ${fmtN(T)}</span><span class="pill ${over||!cap?'':'on'}" style="${over?'background:rgba(212,55,44,.12);color:var(--bad)':''}">${!cap?'No flights':over?'Oversupplied':ratio<.5?'Room to grow':'Balanced'}</span></div>`}
const weekHours=p=>p.sched.reduce((h,s)=>{const r=route(s.rid);return r?h+dayCount(s)*2*fm(r.distance,model(p.modelId).speed)/60:h},0);
function estAdd(p,r){const s={rid:r.id,dep:300,days:[0,0,0,0,0,0,0].map(Boolean),seq:1e12};
  for(let D=0;D<7;D++){s.days[D]=true;if(hasConflict(p,p.sched.concat([s])))s.days[D]=false}
  if(!s.days.some(Boolean))return 0;p.sched.push(s);const v=rotProfit(p,s);p.sched.pop();return v}
function weekProfit(p){return p.sched.reduce((t,s)=>t+rotProfit(p,s),0)}
function hasConflict(p,list){
  const ivs=[];list.forEach((x,i)=>{const r=route(x.rid);if(!r)return;const d=2*fm(r.distance,model(p.modelId).speed)+taOf(x)+30;x.days.forEach((on,D)=>{if(on)ivs.push([D*1440+x.dep,D*1440+x.dep+d,i])})});
  for(let i=0;i<ivs.length;i++)for(let j=i+1;j<ivs.length;j++){const a=ivs[i],b=ivs[j];for(const sh of[0,WEEK,-WEEK])if(a[0]<b[1]+sh&&b[0]+sh<a[1])return true}
  return false;
}

// ==================== SIMULATION ====================
const paxSum=a=>a.pax.Y+a.pax.W+a.pax.C+a.pax.F;
function addStat(id,o,i,c){const st=S.hubStat[id]??={out:0,in:0,cargo:0};st.out+=o;st.in+=i;st.cargo+=c}
function depart(p,s,r,arr,al,di){const a=(al||alloc(r)).out.get(s);if(!a)return;S.pending.push({at:arr,rev:(a.legs?a.rev/a.legs:0)-legCost(model(p.modelId),r),pid:p.id});
  const n=paxSum(a);addStat(r.from,di?0:n,di?n:0,a.pax.L+a.pax.M)}
function simulate(step){
  const t0=S.clock,t1=t0+(step||15*SPEED);S.clock=t1;
  const w=Math.floor(t1/WEEK);S.routes.forEach(r=>{if(r.week<w)newWeek(r,w)});
  const AC={},al=r=>AC[r.id]??=alloc(r);
  S.planes.forEach(p=>p.sched.forEach(s=>{
    const r=route(s.rid);if(!r)return;const f=fm(r.distance,model(p.modelId).speed);
    for(let D=Math.floor(t0/1440)-2;D<=Math.floor(t1/1440);D++){if(!s.days[((D%7)+7)%7])continue;
      [0,f+taOf(s)].forEach((o,di)=>{const dep=D*1440+s.dep+o;if(dep>t0&&dep<=t1)depart(p,s,r,dep+f,al(r),di)})}
  }));
  S.pending=S.pending.filter(e=>{if(e.at<=t1){S.vault+=e.rev;S.totalRevenue+=e.rev;const p=plane(e.pid);if(p)p.totalEarned=(p.totalEarned||0)+e.rev;return false}return true});
}

// ---- custom dropdown (replaces native <select>)
const DD={};
function dd(id,opts,val,on,search){DD[id]={val:String(val),on,opts};const cur=opts.find(o=>String(o[0])===String(val))||opts[0];
  const sr=search??opts.length>6;
  return `<div class="dd" id="dd-${id}"><button type="button" class="ddb" onclick="ddToggle('${id}',event)"><span>${cur[1]}</span><i class="fi fi-rr-angle-small-down"></i></button><div class="ddl${sr?' hs':''}">${sr?`<div class="dds"><i class="fi fi-rr-search"></i><input type="text" placeholder="Search" autocomplete="off" aria-label="Search options" oninput="ddFilter('${id}',this.value)" onclick="event.stopPropagation()"></div>`:''}<div class="ddo">${opts.map(o=>`<button type="button" data-v="${esc(o[0])}" class="${String(o[0])===String(val)?'on':''}" onclick="ddPick('${id}',this.dataset.v)">${o[1]}</button>`).join('')}</div>${sr?'<div class="dde">No results</div>':''}</div></div>`}
function ddFilter(id,q){const el=document.getElementById('dd-'+id);if(!el)return;q=q.toLowerCase().trim();let n=0;
  el.querySelectorAll('.ddo button').forEach(b=>{const m=!q||b.textContent.toLowerCase().includes(q);b.style.display=m?'':'none';if(m)n++});
  const e=el.querySelector('.dde');if(e)e.style.display=n?'none':'block'}
function kebab(id,items){return `<div class="dd" id="dd-kb${id}" data-w="170"><button type="button" class="kbtn" aria-label="More actions" onclick="ddToggle('kb${id}',event)">⋮</button><div class="ddl">${items.map(([l,fn,c])=>`<button type="button" class="${c||''}" onclick="ddClose();${fn}">${l}</button>`).join('')}</div></div>`}
function ddClose(){document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'))}
function ddToggle(id,e){e.stopPropagation();const el=document.getElementById('dd-'+id),open=!el.classList.contains('open');ddClose();if(!open)return;
  const b=el.querySelector('.ddb,.kbtn').getBoundingClientRect(),w=+el.dataset.w||b.width,l=el.querySelector('.ddl'),below=innerHeight-b.bottom-16,above=b.top-16,up=below<200&&above>below;
  l.style.left=(el.dataset.w?Math.max(8,b.right-w):b.left)+'px';l.style.width=w+'px';l.style.maxHeight=Math.min(l.classList.contains('hs')?340:280,up?above:below)+'px';
  if(up){l.style.top='auto';l.style.bottom=(innerHeight-b.top+6)+'px'}else{l.style.bottom='auto';l.style.top=(b.bottom+6)+'px'}
  el.classList.add('open');
  const inp=el.querySelector('.dds input');if(inp){inp.value='';ddFilter(id,'');if(matchMedia('(hover:hover)').matches)setTimeout(()=>inp.focus(),30)}
  const cur=el.querySelector('.ddo button.on');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest'})}
function ddPick(id,v){const d=DD[id],el=document.getElementById('dd-'+id);d.val=v;ddClose();
  el.querySelectorAll('.ddl button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  el.querySelector('.ddb span').innerHTML=(d.opts.find(o=>String(o[0])===v)||d.opts[0])[1];if(d.on)d.on(v)}
document.addEventListener('click',ddClose);
window.addEventListener('scroll',e=>{if(!(e.target.closest&&e.target.closest('.ddl')))ddClose()},true);
window.addEventListener('resize',ddClose);

// ==================== DIALOGS ====================
function dlg(h,cls){const d=$('#dlg');d.className='dlg'+(cls?' '+cls:'');d.innerHTML=h;decorate(d);$('#ov').classList.add('show')}
function closeDlg(){$('#ov').classList.remove('show')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg()});
function confirmDlg(t,m,ok,fn,danger){dlg(`<h3>${t}</h3><p>${m}</p><div class="acts"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn ${danger?'d':'p'}" id="okb">${ok}</button></div>`);$('#okb').onclick=()=>{closeDlg();fn()}}
function info(t,m){dlg(`<h3>${t}</h3><p>${m}</p><div class="acts"><button class="btn p" onclick="closeDlg()">OK</button></div>`)}

// ==================== RENDER ====================
const TABS=[['home','Home','fi-sr-home'],['fleet','Fleet','fi-sr-plane'],['owned','Airport','fi-sr-marker'],['buy','Buy','fi-sr-shopping-cart'],['finance','Finances','fi-sr-vault'],['more','More','fi-sr-menu-dots']];
const seg=(key,items)=>`<div class="seg">${items.map(([v,l])=>`<button class="${UI[key]===v?'on':''}" onclick="setUI('${key}','${v}')">${l}</button>`).join('')}</div>`;
const empty=t=>`<div class="empty"><i class="fi fi-rr-plane"></i>${t}</div>`;
const back=(extra='',_t,toBuy)=>`<div class="row" style="margin-bottom:12px"><button class="btn sm" onclick="${toBuy?(UI.page.mode==='refit'?'UI.page=null;render()':`setPage({t:'buy',mid:'${UI.page.mid}'})`):'setPage(null)'}">‹ Back</button>${extra}</div>`;
function setUI(k,v){UI[k]=v;UI.sel=false;UI.picked={};if(k==='buy'||k==='owned')UI.q='';render()}
function go(t,k,v){UI.tab=t;UI.page=null;UI.sel=false;UI.picked={};if(k)UI[k]=v;render()}
function setPage(p){UI.page=p;render();scrollTo(0,0)}
function head(){
  $('#hName').textContent=S.airlineName;$('#hCash').textContent=fmt(S.cash);
  $('#hStats').innerHTML=[['fi-rr-clock',clockStr(S.clock)],['fi-rr-plane',S.planes.length],['fi-sr-marker',ownedHubs().length],['fi-rr-route',S.routes.length]].map(([i,n])=>`<span><i class="fi ${i}"></i>${n}</span>`).join('');
}
// ---- pagination (max 10 per page): « ‹ 1 / n › »
const PG={},PER=10;
function pgInfo(k,n){const pages=Math.max(1,Math.ceil(n/PER)),p=Math.min(Math.max(PG[k]||1,1),pages);PG[k]=p;return{p,pages}}
function pageOf(k,arr,fn){if(!arr.length)return '';const{p,pages}=pgInfo(k,arr.length),a=arr.slice((p-1)*PER,p*PER).map(x=>fn(x)).join('');
  const b=(l,t,dis,aria)=>`<button class="btn sm" onclick="pgSet('${k}',${t})" ${dis?'disabled':''} aria-label="${aria}">${l}</button>`;
  return `<div class="pgs" id="pgs-${k}"></div>`+a+(pages>1?`<div class="pager">${b('«',1,p===1,'First page')}${b('‹',p-1,p===1,'Previous page')}<span class="pn">${p}<small> / ${pages}</small></span>${b('›',p+1,p===pages,'Next page')}${b('»',pages,p===pages,'Last page')}</div>`:'')}
function pgSet(k,v){PG[k]=v;render();const a=document.getElementById('pgs-'+k);if(a&&a.scrollIntoView)a.scrollIntoView({behavior:'smooth',block:'start'})}

const IC_BTN=[[/^Back$/,'fi-rr-angle-small-left'],[/^Open route$/,'fi-rr-route'],[/^Add rotation$/,'fi-rr-plus'],[/^Add one$/,'fi-rr-plus'],[/^Fill the day$/,'fi-rr-calendar'],[/^Schedule$/,'fi-rr-calendar'],[/^(Select|Done|OK|Apply)$/,'fi-rr-check'],[/^Re-config$/,'fi-rr-settings'],[/^Sell/,'fi-rr-coins'],[/^Collect/,'fi-rr-coins'],[/^Close routes?$/,'fi-rr-cross-small'],[/^Cancel$/,'fi-rr-cross-small'],[/^Purchase/,'fi-rr-shopping-cart'],[/^(New airline|Start over)$/,'fi-rr-refresh'],[/^Buy hub$/,'fi-sr-marker']];
const IC_HEAD={'Aircraft based here':'fi-sr-plane','Routes from here':'fi-rr-route','Buy a hub':'fi-sr-marker','Most active destination':'fi-sr-marker','Appearance':'fi-rr-palette','Airline':'fi-sr-plane-departure','Add rotation':'fi-rr-calendar','Insufficient funds':'fi-rr-coins','Welcome back':'fi-sr-plane-departure','Sort by':'fi-rr-sort-alt','Aircraft reference':'fi-rr-plane','Open route':'fi-rr-route'};
function decorate(root){if(!root)return;
  root.querySelectorAll('button.btn,.dd[id^="dd-kb"] .ddl button').forEach(b=>{if(b.querySelector('.bi'))return;const t=b.textContent.replace(/^[‹＋+]\s*/,'').trim(),m=IC_BTN.find(([r])=>r.test(t));
    if(m)b.innerHTML='<i class="fi '+m[1]+' bi"></i>'+b.innerHTML.replace(/^[‹＋+]\s*/,'')});
  root.querySelectorAll('h2,h3,.s').forEach(e=>{if(e.children.length)return;const ic=IC_HEAD[e.textContent.trim()];if(ic)e.innerHTML='<i class="fi '+ic+' bi"></i>'+e.innerHTML})}

let LASTSIG=null;const SEGPREV={};
function render(){ALCACHE=new Map();try{renderInner()}finally{ALCACHE=null}}
function renderInner(){
  head();
  $('#nav').innerHTML=TABS.map(([t,l,ic])=>`<button class="${UI.tab===t?'on':''}" onclick="go('${t}')" aria-label="${l}"><i class="fi ${ic}"></i>${l}</button>`).join('');
  const nv=$('#nav');nv.style.setProperty('--n',TABS.length);nv.style.setProperty('--i',Math.max(0,TABS.findIndex(t=>t[0]===UI.tab)));
  const pg=UI.page;if(pg&&((pg.t==='route'&&!route(pg.id))||(pg.t==='sched'&&!plane(pg.id))||(pg.t==='rot'&&!(plane(pg.pid)&&plane(pg.pid).sched[pg.i]))||(pg.t==='hub'&&!S.hubs[pg.id])))UI.page=null;
  const v=$('#view');
  if(UI.page)v.innerHTML=({open:pageOpen,route:()=>pageRoute(UI.page.id),sched:()=>pageSched(UI.page.id),hub:()=>pageHub(UI.page.id),rot:pageRot,buy:pageBuy,cfg:pageCfg})[UI.page.t]();
  else v.innerHTML={home:viewHome,fleet:viewFleet,owned:viewOwned,buy:viewBuy,finance:viewFinance,more:viewMore}[UI.tab]();
  const sig=UI.tab+'|'+(UI.page?UI.page.t+':'+(UI.page.id??UI.page.pid??UI.page.mid??''):'');
  if(sig!==LASTSIG){LASTSIG=sig;[...v.children].forEach((c,i)=>{c.classList.add('rise');c.style.animationDelay=Math.min(i,9)*50+'ms'})}
  v.querySelectorAll('.seg').forEach((s,k)=>{const bs=[...s.querySelectorAll('button')],cur=bs.findIndex(b=>b.classList.contains('on'));if(cur<0)return;
    const key=sig+'#'+k,prev=SEGPREV[key],p=document.createElement('i');p.className='segp';p.style.setProperty('--n',bs.length);p.style.setProperty('--i',prev??cur);s.prepend(p);
    if(prev!=null&&prev!==cur){void p.offsetWidth;p.style.setProperty('--i',cur)}SEGPREV[key]=cur});
  decorate(v);
  save();
}

// ---- Home
function chart(){
  const nw=S.history.nw,rv=S.history.rev;
  if(nw.length<2)return empty('The chart fills in as your airline operates.');
  const all=nw.concat(rv),lo=Math.min(...all),hi=Math.max(...all),W=300,H=120;
  const pts=a=>a.map((v,i)=>`${(i/(a.length-1)*W).toFixed(1)},${(H-8-(v-lo)/((hi-lo)||1)*(H-16)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:180px;display:block;color:var(--accent)" role="img" aria-label="Net worth and revenue"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><polygon points="0,${H} ${pts(nw)} ${W},${H}" fill="url(#g)"/><polyline points="${pts(rv)}" fill="none" stroke="#7f8794" stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/><polyline points="${pts(nw)}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="row s" style="margin-top:8px"><span>${fmt(lo)}</span><span>${fmt(hi)}</span></div>`;
}
function destStats(){const m={};S.routes.forEach(r=>{const o=m[r.to]??={id:r.to,flights:0};o.flights+=legsWeek(r)/2});return Object.values(m).sort((a,b)=>b.flights-a.flights)}
function viewHome(){
  const nw=S.cash+S.vault,d=nw-(S.history.nw[0]??nw),ds=destStats(),top=ds[0],th=top&&hub(top.id);
  return `<div class="card"><div class="row" style="margin-bottom:12px"><div><div class="s">Net worth</div><b class="num" style="font-size:22px">${fmt(nw)}</b></div><span class="s ${d>=0?'good':'bad'}">${d>=0?'+':'−'}${fmt(Math.abs(d))} this session</span></div>${chart()}<div class="row s" style="margin-top:6px"><span>━ Net worth</span><span>╌ Revenue</span></div></div>
  <div class="tiles" style="grid-template-columns:1fr 1fr;margin-top:0"><div><span class="s">Aircraft</span><b class="num" style="font-size:24px">${S.planes.length}</b></div><div><span class="s">Destinations</span><b class="num" style="font-size:24px">${ds.length}</b></div></div>

// one representative aircraft per model (the registration stays on the plane, just not listed here)
function refModels(list){const seen=new Set();return list.filter(p=>!seen.has(p.modelId)&&seen.add(p.modelId))}
function refAc(){const p=UI.openAc?plane(+UI.openAc):null;return p&&p.hubId===UI.rangeHub?p:null}
function openList(){
  const from=UI.rangeHub,ac=refAc(),m=ac?model(ac.modelId):null,km=m?m.range:UI.rangeKm,spd=m?m.speed:850,[k,dir]=UI.openSort.split('_'),key={dem:x=>x.w,dist:x=>x.d,rot:x=>x.rot};

function confirmOpen(from,to){

function setFare(id,k,v){const r=route(id);if(!r)return;if(k==='*')r.fares=defFares(r.distance);else{const b=baseTicket(r.distance)*FR[k];fareOf(r)[k]=Math.max(Math.round(b*.5),Math.min(Math.round(b*2.2),Math.round(+v)||Math.round(b)))}save();render()}
function pageRoute(id){

// ---- Schedule
const rotNos=(s,r)=>{const o=s.fn||flightNos(r)[0];return[o,/\d+$/.test(o)?o.replace(/\d+$/,x=>String(+x+1)):o+'B']};
const dayTxt=s=>s.days.every(Boolean)?'Daily':DAYS.filter((d,k)=>s.days[k]).join(' ')||'No days';
function bookedPct(p,s){const r=route(s.rid),a=alloc(r).out.get(s);return a?Math.round(['Y','W','C','F'].reduce((x,k)=>x+a.pax[k],0)/Math.max(1,seatsOf(cfgOf(p)))*100):0}
function addRot(p,rid,fill,dep0){
  const r=route(rid),m=model(p.modelId);if(!r||m.range<r.distance||p.hubId!==r.from||!okCls(m,r))return false;let added=0;
  // A round trip longer than 24 h can't run every day, and a clash on some days isn't fatal either:
  // the rotation simply takes the days that are free.
  const tryAt=d=>{const s={rid,dep:d,days:[0,0,0,0,0,0,0].map(Boolean)};
    for(let D=0;D<7;D++){s.days[D]=true;if(hasConflict(p,p.sched.concat([s])))s.days[D]=false}
    if(!s.days.some(Boolean))return false;s.seq=S.seq=(S.seq||0)+1;p.sched.push(s);added++;return true};
  if(dep0!=null&&!fill)return tryAt(dep0);
  const len=2*fm(r.distance,m.speed)+TURN,short=len<=1200;
  for(let d=dep0!=null?dep0:300;short?d+len<=1440+240:d<1440;d+=5){if(tryAt(d)){if(!fill||!short)break;d+=len+55}}
  return added>0;
}
function addDlg(pid){
  const p=plane(pid),m=model(p.modelId),rs=S.routes.filter(r=>r.from===p.hubId&&r.distance<=m.range&&okCls(m,r));
  if(!rs.length)return info('No routes','Open a route from '+hub(p.hubId).code+' within '+fmtN(m.range)+' km first.');
  dlg(`<h3>Add rotation</h3><p style="margin-bottom:10px">Round trip from ${hub(p.hubId).code}. Set the time and turnaround in the editor.</p>${dd('ar',rs.map(r=>[r.id,`${flightNos(r)[0]} · ${hub(r.from).code} ⇄ ${hub(r.to).code} · ${fmtN(r.distance)} km`]),rs[0].id,null,true)}<div class="acts"><button class="btn" id="a1">Add one</button><button class="btn p" id="a2">Fill the day</button></div>`,'wide');
  $('#a1').onclick=()=>{const ok=addRot(p,+DD.ar.val,false);closeDlg();if(!ok)info('No free time','No free slot for another rotation.');else setPage({t:'rot',pid,i:p.sched.length-1})};
  $('#a2').onclick=()=>{const ok=addRot(p,+DD.ar.val,true);closeDlg();if(!ok)info('No free time','No free slot for another rotation.');else render()};
}
function rmRot(pid,i){plane(pid).sched.splice(i,1);render()}
function weekSegs(p){
  const m=model(p.modelId),cols=[[],[],[],[],[],[],[]];
  p.sched.forEach((s,i)=>{const r=route(s.rid);if(!r)return;const f=fm(r.distance,m.speed),t2=s.dep+f+taOf(s),a=hub(r.from).code,b=hub(r.to).code;
    const parts=[[s.dep,s.dep+f,'out',a+'›'+b,hhmm(s.dep)],[s.dep+f,t2,'turn','',''],[t2,t2+f,'ret',b+'›'+a,hhmm(t2)]];
    s.days.forEach((on,D)=>{if(!on)return;parts.forEach(([x,y,kind,lab,t])=>{const add=(d,x0,y0)=>cols[d%7].push({x:x0,y:y0,kind,lab,t,id:r.id,i});
      if(x>=1440)add(D+1,x-1440,y-1440);else if(y>1440){add(D,x,1440);add(D+1,0,y-1440)}else add(D,x,y)})})});
  return cols;
}
const hue=id=>(id*67+20)%360,rcol=id=>`hsl(${hue(id)} 52% 40%)`;

  const rots=p.sched.map((s,i)=>{const r=route(s.rid),f=fm(r.distance,m.speed),ta=taOf(s),t2=s.dep+f+ta,c=`--c:${rcol(r.id)}`,pc=v=>(v/1440*100)+'%',[n1,n2]=rotNos(s,r);
    return `<div class="card"><div class="row"><div><span class="tag">${n1} / ${n2}</span> <span class="t">${hub(r.from).code} ⇄ ${hub(r.to).code}</span><div class="s">${hhmm(s.dep)} → ${hhmm(s.dep+f)} · back ${hhmm(t2)} → ${hhmm(t2+f)} · TA ${ta} min · ${dayTxt(s)} · <b class="${rotProfit(p,s)>=0?'good':'bad'}">${fmt(rotProfit(p,s))}/wk</b></div></div><div style="display:flex;gap:6px;flex:none"><button class="btn sm" onclick="setPage({t:'rot',pid:${pid},i:${i}})">Edit</button><button class="btn sm d" onclick="rmRot(${pid},${i})">Remove</button></div></div>
    <div class="tl" style="${c}"><i style="left:${pc(s.dep)};width:${pc(f)}"></i><i class="turn" style="left:${pc(s.dep+f)};width:${pc(ta)}"></i><i class="ret" style="left:${pc(t2)};width:${pc(f)}"></i></div><div class="tlh"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></div>`}).join('');

  `<div class="card"><div class="tiles" style="margin-top:0"><div><span class="s">Range</span><b class="num">${fmtN(m.range)} km</b></div><div><span class="s">Weekly ops</span><b class="num">${Math.round(weekHours(p))} h</b></div><div><span class="s">Weekly profit</span><b class="num ${weekProfit(p)>=0?'good':'bad'}">${fmt(weekProfit(p))}</b></div></div></div>
  <div class="acts" style="margin:0 0 10px"><button class="btn p" onclick="addDlg(${pid})">＋ Add rotation</button></div>${rots||empty('No rotations yet. Add one or assign this aircraft from a route.')}
  <h2>Weekly schedule</h2><div class="lg"><span><i></i>Outbound</span><span><i class="t"></i>Turnaround</span><span><i class="r"></i>Return</span></div>
  <div class="sgh"><span></span>${DAYS.map((d,k)=>`<span class="${k===today?'today':''}">${d}</span>`).join('')}</div>
  <div class="sg"><div class="hr">${hrs}</div>${cols.map((c,D)=>`<div class="col">${c.map(b=>`<div class="blk ${b.kind}" style="--c:${rcol(b.id)};top:${b.x/14.4}%;height:${(b.y-b.x)/14.4}%"><span>${b.lab}</span><small>${b.t}</small></div>`).join('')}${D===today?`<div class="now" style="top:${(S.clock%1440)/14.4}%"></div>`:''}</div>`).join('')}</div>`;
}
// ---- flight editor (custom time picker, turnaround, draggable week)
function wkHTML(p,cur){
  const cols=weekSegs(p);
  return `<div class="r"><span class="lab"></span><div class="hh">${[0,6,12,18,24].map(h=>`<span style="left:${h/24*100}%">${pad(h)}:00</span>`).join('')}</div></div>`+cols.map((c,D)=>`<div class="r"><span class="lab">${DAYS[D]}</span><div class="trk">${c.map(b=>`<i class="b ${b.i===cur?'c':'g'} ${b.kind[0]}" ${b.i===cur?'':`data-i="${b.i}"`} style="left:${b.x/14.4}%;width:${(b.y-b.x)/14.4}%"></i>`).join('')}</div></div>`).join('');

function legsHTML(p,s){

function pageRot(){
  const pg=UI.page,p=plane(pg.pid),s=p.sched[pg.i],r=route(s.rid),m=model(p.modelId),f=fm(r.distance,m.speed),ta=taOf(s),both=UI.rotMode!=='ret',[n1,n2]=rotNos(s,r),cur=both?s.dep:(s.dep+f+ta)%1440;
  setTimeout(bindWk);
  return `<div class="row" style="margin-bottom:12px"><button class="btn sm" onclick="UI.rotErr='';setPage({t:'sched',id:${p.id}})">‹ Schedule</button><span class="s">Round trip with <b style="color:var(--ink)">${n1}</b></span></div>
  <div class="seg"><button class="${both?'on':''}" onclick="UI.rotMode='both';render()">Move both</button><button class="${both?'':'on'}" onclick="UI.rotMode='ret';render()">Only ${n2}</button></div>
  <div class="card"><b>${both?'Departure time':'Return departure'}</b><div class="s">${p.reg}: ${bookedPct(p,s)}% booked, ${(weekHours(p)/7).toFixed(1)} h a day · <b class="${rotProfit(p,s)>=0?'good':'bad'}">${fmt(rotProfit(p,s))}/wk</b></div>
   <div class="tp"><button class="btn sm" onclick="rotShift(-60)">−1h</button><button class="btn sm" onclick="rotShift(-5)">−5m</button><div class="tpv"><input type="number" id="tph" min="0" max="23" value="${pad(Math.floor(cur/60))}" onchange="rotSet()" aria-label="Hour"><b>:</b><input type="number" id="tpm" min="0" max="59" value="${pad(cur%60)}" onchange="rotSet()" aria-label="Minute"></div><button class="btn sm" onclick="rotShift(5)">+5m</button><button class="btn sm" onclick="rotShift(60)">+1h</button></div>

   <div class="row" style="margin-top:14px"><div><div class="t">Turnaround time</div><div class="s">Time on the ground at ${hub(r.to).code}</div></div><div class="step"><button class="btn sm" onclick="taShift(-15)">−15</button><button class="btn sm" onclick="taShift(-5)">−5</button><b style="min-width:62px">${ta} min</b><button class="btn sm" onclick="taShift(5)">+5</button><button class="btn sm" onclick="taShift(15)">+15</button></div></div>
   <div class="wk" id="wkv">${wkHTML(p,pg.i)}</div><div class="s" style="margin-top:6px">Drag across the week or type a time. Tap a grey flight to edit it.</div>${UI.rotErr?`<div class="err">${UI.rotErr}</div>`:''}</div>
  <div class="card"><div class="row" style="align-items:flex-start;gap:16px"><div style="flex:1"><div class="s">Flight number</div><input type="text" maxlength="8" value="${esc(n1)}" onchange="rotFn(this.value)" style="margin-top:4px" aria-label="Flight number"><div class="s" style="margin-top:12px">Days</div><div class="dys">${DAYS.map((d,k)=>`<button class="dy ${s.days[k]?'on':''}" onclick="rotDay(${k})" aria-label="${d}">${d[0]}</button>`).join('')}</div></div></div>
   <div class="s" style="margin:16px 0 8px">Fares · shared by the whole route</div>${fareBox(r)}</div>
  <div class="row" style="margin-top:6px"><button class="btn d" onclick="rotDel()">Delete ${n1} and ${n2}</button><button class="btn p" onclick="UI.rotErr='';setPage({t:'sched',id:${p.id}})">Save both</button></div>`;
}
function rotApply(fn){const p=plane(UI.page.pid),s=p.sched[UI.page.i],bak={dep:s.dep,ta:s.ta,days:s.days.slice()};fn(s,p);if(hasConflict(p,p.sched)){Object.assign(s,bak);UI.rotErr='That overlaps another rotation of this aircraft.'}else UI.rotErr='';render()}
const rotF=(s,p)=>fm(route(s.rid).distance,model(p.modelId).speed);
function rotShift(d){rotApply((s,p)=>{if(UI.rotMode==='ret')s.ta=Math.max(TA_MIN,taOf(s)+d);else s.dep=(s.dep+d+1440)%1440})}
function rotSet(){const v=((+$('#tph').value||0)%24)*60+((+$('#tpm').value||0)%60);rotApply((s,p)=>{if(UI.rotMode==='ret')s.ta=Math.max(TA_MIN,((v-s.dep-rotF(s,p))%1440+1440)%1440);else s.dep=v})}
function taShift(d){rotApply(s=>{s.ta=Math.max(TA_MIN,Math.min(720,taOf(s)+d))})}
function rotDay(k){rotApply(s=>{s.days[k]=!s.days[k]})}
function rotFn(v){const s=plane(UI.page.pid).sched[UI.page.i];v=v.trim().toUpperCase().slice(0,8);if(v)s.fn=v;else delete s.fn;render()}
function rotDel(){const pid=UI.page.pid;plane(pid).sched.splice(UI.page.i,1);UI.rotErr='';setPage({t:'sched',id:pid})}
function dragTo(v){
  const pg=UI.page,p=plane(pg.pid),s=p.sched[pg.i],bak={dep:s.dep,ta:s.ta};
  if(UI.rotMode==='ret')s.ta=Math.max(TA_MIN,((v-s.dep-rotF(s,p))%1440+1440)%1440);else s.dep=v;
  if(hasConflict(p,p.sched)){s.dep=bak.dep;s.ta=bak.ta;return}
  const cur=UI.rotMode==='ret'?(s.dep+rotF(s,p)+taOf(s))%1440:s.dep;
  $('#wkv').innerHTML=wkHTML(p,pg.i);$('#legs').innerHTML=legsHTML(p,s);$('#tph').value=pad(Math.floor(cur/60));$('#tpm').value=pad(cur%60);
}
function bindWk(){
  const w=$('#wkv');if(!w||!w.setPointerCapture)return;let drag=false;
  const at=e=>{const t=w.querySelector('.trk').getBoundingClientRect();return Math.max(0,Math.min(1435,Math.round((e.clientX-t.left)/t.width*1440/5)*5))};
  w.onpointerdown=e=>{const g=e.target.closest('[data-i]');if(g){UI.page.i=+g.dataset.i;return render()}drag=true;w.setPointerCapture(e.pointerId);dragTo(at(e))};
  w.onpointermove=e=>{if(drag)dragTo(at(e))};
  w.onpointerup=w.onpointercancel=()=>{if(drag){drag=false;render()}};
}

  const sum=KEYS.filter(k=>c[k].n).map(k=>`<div class="card row"><div><div class="s">${CNAME[k].toUpperCase()}</div><div class="t">${PROD[k][c[k].p][0]} <span class="s">· ${c[k].n} seats</span></div></div><span class="pill">${rate(k,c[k])}%</span></div>`).join('');
  const cgRow=`<div class="card row"><div><div class="s">CARGO HOLD</div><div class="t">Light ${c.L.n} t · Medium ${c.M.n} t <span class="s">of ${cargoCap(m)} t</span></div></div></div>`;
  return back(`<span class="tag">${m.icao}</span>`)+`<div class="card hero"><div class="t" style="font-size:20px">${m.name}</div><div class="s">${mk} · ${FAMILIES[m.family]} Family · Code ${m.cls}</div><div class="tiles"><div><span class="s">Range</span><b class="num">${fmtN(m.range)} km</b></div><div><span class="s">Max seats</span><b class="num">${m.seats}</b></div><div><span class="s">Price</span><b class="num">${fmt(m.price)}</b></div></div></div>
  <div class="row" style="margin:18px 2px 8px"><b>Seat configuration</b><span class="s">${seatsOf(c)} seats${c.name?' · '+esc(c.name):''} · +${fmt(cfgCost(c))}</span></div>
  <div class="acts" style="margin:0 0 10px"><button class="btn" onclick="loadDlg('${mid}')">Load config</button><button class="btn" onclick="setPage({t:'cfg',mid:'${mid}',mode:'buy'})">Edit config</button></div>${sum}${cgRow}
  <h2>Delivery</h2>`+(hubs.length?`${dd('bh',hubs.map(i=>[i,`${hub(i).flag} ${esc(hub(i).city)} (${hub(i).code})`]),UI.buyHub||hubs[0],v=>{UI.buyHub=v})}
  <div class="row" style="margin:12px 0"><span class="s">Quantity</span><div class="step"><button class="btn sm" onclick="setQ(-1)">−</button><b id="bq">${UI.buyQ}</b><button class="btn sm" onclick="setQ(1)">+</button></div></div>
  <button class="btn p" id="bbtn" style="width:100%;padding:13px" onclick="doBuy('${mid}')">${buyBtn()}</button>`:`<div class="card row"><div class="s">${ownedHubs().length?`None of your hubs can base a Code ${m.cls} aircraft. Buy a hub with Code ${m.cls} or higher.`:'You need a hub to base aircraft.'}</div><button class="btn sm p" onclick="go('owned','owned','hubs')">Buy hub</button></div>`);
}
function setQ(d){const mid=UI.page.mid,max=Math.max(1,Math.min(50,Math.floor(S.cash/unitCost(mid))));UI.buyQ=Math.max(1,Math.min(max,UI.buyQ+d));$('#bq').textContent=UI.buyQ;$('#bbtn').textContent=buyBtn()}
function doBuy(mid){
  const m=model(mid),c=draft(mid),q=UI.buyQ,u=unitCost(mid),h=DD.bh?DD.bh.val:ownedHubs()[0];UI.buyHub=h;
  if(S.cash<u*q)return info('Insufficient funds',`You need ${fmt(u*q-S.cash)} more.`);
  S.cash-=u*q;for(let i=0;i<q;i++)S.planes.push({id:S.nextPlaneId++,reg:newReg(),modelId:mid,hubId:h,sched:[],totalEarned:0,cfg:clone(c)});
  UI.tab='fleet';UI.page=null;render();
}
function pageCfg(){
  const g=UI.page,m=model(g.mid),c=fixCfg(curCfg(),model(g.mid)),used=usedSpace(c),refit=g.mode==='refit',cc=cargoCap(m),mult=refit&&g.pids?g.pids.length:1;
  const cargoCard=`<div class="card"><div class="row"><div><div class="s">CARGO HOLD</div><div class="t">Light ${c.L.n} t · Medium ${c.M.n} t <span class="s">of ${cc} t</span></div></div><span class="pill">${fmt((c.L.n*8000+c.M.n*12000)*SC)}</span></div>${[['L','Light cargo (parcels)'],['M','Medium cargo']].map(([k,l])=>`<div class="row" style="margin-top:10px"><span class="s">${l}</span><div class="step"><button class="btn sm" onclick="cfgCg('${k}',-5)">−5</button><button class="btn sm" onclick="cfgCg('${k}',-1)">−</button><b>${c[k].n} t</b><button class="btn sm" onclick="cfgCg('${k}',1)">+</button><button class="btn sm" onclick="cfgCg('${k}',5)">+5</button></div></div>`).join('')}</div>`;
  const cls=KEYS.map(k=>{const p=c[k],pr=PROD[k],lim=k==='Y'?[26,34]:[34,42];
    return `<div class="card"><div class="row"><div><div class="s">${CNAME[k].toUpperCase()}</div><div class="t">${pr[p.p][0]} <span class="s">· ${p.n} seats</span></div></div><span class="pill">${rate(k,p)}%</span></div>
    <div class="row" style="margin-top:10px"><span class="s">Seats</span><div class="step"><button class="btn sm" onclick="cfgN('${k}',-10)">−10</button><button class="btn sm" onclick="cfgN('${k}',-1)">−</button><b>${p.n}</b><button class="btn sm" onclick="cfgN('${k}',1)">+</button><button class="btn sm" onclick="cfgN('${k}',10)">+10</button></div></div>
    <div class="chips">${pr.map((x,i)=>`<button class="chip ${i===p.p?'on':''}" onclick="cfgProd('${k}',${i})">${x[0]}<small>${fmt(x[1]*SC)} / seat</small></button>`).join('')}</div>
    ${p.pt!=null&&k!=='F'&&k!=='C'?`<div class="row" style="margin-top:10px"><span class="s">Seat pitch</span><div class="step"><button class="btn sm" onclick="cfgPt('${k}',-1)" ${p.pt<=lim[0]?'disabled':''}>−</button><b>${p.pt} in</b><button class="btn sm" onclick="cfgPt('${k}',1)" ${p.pt>=lim[1]?'disabled':''}>+</button></div></div>`:''}</div>`}).join('');
  return back(`<b>${m.name}</b>`,refit?{t:'sched'}:null,true)+`<div class="card"><div class="row"><div><div class="s">Seats</div><b class="num">${seatsOf(c)}</b></div><div style="text-align:center"><div class="s">Cabin space</div><b class="num">${Math.round(used)} / ${m.seats}</b></div><div style="text-align:right"><div class="s">${refit?'Refit cost':'Config cost'}</div><b class="num">${fmt(cfgCost(c)*mult)}</b></div></div><div class="bar"><i style="width:${Math.min(100,used/m.seats*100)}%"></i></div></div>${cls}${cargoCard}
  <div class="acts"><button class="btn" onclick="saveDlg()">Save config</button><button class="btn" onclick="loadDlg('${g.mid}')">Load config</button></div>
  <div class="acts">${refit?`<button class="btn p" onclick="applyRefit()">Apply · ${fmt(cfgCost(c)*mult)}</button>`:`<button class="btn p" onclick="setPage({t:'buy',mid:'${g.mid}'})">✓ Done</button>`}</div>`;
}
function cfgCg(k,d){const c=curCfg(),m=model(UI.page.mid),o=k==='L'?'M':'L';fixCfg(c,m);delete c.name;c[k].n=Math.max(0,Math.min(cargoCap(m)-c[o].n,c[k].n+d));render()}
function cfgN(k,d){const c=curCfg(),cap=model(UI.page.mid).seats,st=Math.sign(d);delete c.name;
  for(let i=0;i<Math.abs(d);i++){const bak=clone(c);c[k].n+=st;if(c[k].n<0){c[k].n=0;break}
    if(k!=='Y'&&st>0)while(usedSpace(c)>cap+1e-6&&c.Y.n>0)c.Y.n--; // make room by trimming economy
    if(usedSpace(c)>cap+1e-6){Object.assign(c,bak);break}}
  render()}
function cfgProd(k,i){const c=curCfg();c[k].p=i;delete c.name;fitCfg(c,model(UI.page.mid).seats);render()}
function cfgPt(k,d){const c=curCfg(),lim=k==='Y'?[26,34]:[34,42];c[k].pt=Math.max(lim[0],Math.min(lim[1],c[k].pt+d));delete c.name;fitCfg(c,model(UI.page.mid).seats);render()}
function saveDlg(){
  const mid=UI.page.mid,c=curCfg();dlg(`<h3>Save config</h3><p style="margin-bottom:10px">${cfgStr(c)} for ${model(mid).name}</p><input type="text" id="cn" maxlength="24" value="${esc(c.name||'My config')}"><div class="acts"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn p" id="cs">Save</button></div>`);
  $('#cs').onclick=()=>{const n=$('#cn').value.trim()||'My config',L=S.cfgs[mid]=S.cfgs[mid]||[],e={name:n,cfg:Object.assign(clone(c),{name:undefined})},i=L.findIndex(x=>x.name===n);delete e.cfg.name;if(i>=0)L[i]=e;else L.push(e);c.name=n;closeDlg();render()};
}
function loadDlg(mid){
  const L=S.cfgs[mid]||[];
  dlg(`<h3>Load config</h3><p style="margin-bottom:10px">${model(mid).name}</p>${L.length?L.map((e,i)=>`<div class="card"><div class="row"><div><div class="t">${esc(e.name)}</div><div class="s">${cfgStr(e.cfg)} · ${S.planes.filter(p=>p.modelId===mid&&p.cfg&&p.cfg.name===e.name).length} equipped</div></div><span class="pill">Y ${rate('Y',e.cfg.Y)}% · C ${rate('C',e.cfg.C)}%</span></div><div class="acts"><button class="btn sm p" onclick="pickCfg('${mid}',${i})">Select</button><button class="btn sm d" onclick="delCfg('${mid}',${i})">Delete</button></div></div>`).join(''):'<p>No saved configs yet. Edit a config and save it.</p>'}<div class="acts"><button class="btn" onclick="closeDlg()">Close</button></div>`);
}
function pickCfg(mid,i){const e=S.cfgs[mid][i];setCfg(fixCfg(Object.assign(clone(e.cfg),{name:e.name}),model(mid)));closeDlg();render()}
function delCfg(mid,i){S.cfgs[mid].splice(i,1);loadDlg(mid)}
function refitOpen(pids){const ids=[].concat(pids),p=plane(ids[0]);UI.refit=clone(cfgOf(p));setPage({t:'cfg',mid:p.modelId,mode:'refit',pids:ids})}
function applyRefit(){const ps=UI.page.pids.map(plane).filter(Boolean),cost=cfgCost(UI.refit)*ps.length;if(S.cash<cost)return info('Insufficient funds',`You need ${fmt(cost-S.cash)} more.`);
  confirmDlg('Apply new config?',`${ps.length>1?ps.length+' aircraft':ps[0].reg} will be refitted to ${cfgStr(UI.refit)} for ${fmt(cost)}.`,'Apply',()=>{S.cash-=cost;ps.forEach(p=>p.cfg=clone(UI.refit));UI.tab='fleet';UI.page=null;UI.sel=false;UI.picked={};render()})}

function buyList(){
  const q=UI.q.toLowerCase().trim();
  const list=HUBS.filter(h=>h.iso===S.homeCountry&&(!q||[h.city,h.country,h.code,h.icao,h.cls].some(x=>x.toLowerCase().includes(q)))).sort((a,b)=>b.demand-a.demand);
  if(!list.length)return empty('No airports match.');
  return pageOf('shop',list,h=>`<div class="card row"><div><div class="t">${hubName(h)}</div><div class="s">${esc(h.country)} · Demand ${dem(h)}</div></div>${S.hubs[h.id]?'<span class="pill on">Owned</span>':`<button class="btn sm p" onclick="buyHub('${h.id}')" ${S.cash<h.price?'disabled':''}>${fmt(h.price)}</button>`}</div>`);
}
function buyHub(id){const h=hub(id);if(S.hubs[id])return;if(S.cash<h.price)return info('Insufficient funds',`You need ${fmt(h.price-S.cash)} more.`);confirmDlg('Buy hub?',`Acquire ${h.flag} ${h.city} (${h.code} · ${h.icao}) for ${fmt(h.price)}?\nAircraft are based at your hubs and routes start from them.`,'Buy hub',()=>{S.cash-=h.price;S.hubs[id]=true;render()})}

// ---- Vault
function weekTotals(){
  let px=0,cg=0,cost=0;
  S.routes.forEach(r=>{const f=fareOf(r);alloc(r).out.forEach(a=>{for(const k of ['Y','W','C','F'])px+=a.pax[k]*a.legs*f[k];for(const k of ['L','M'])cg+=a.pax[k]*a.legs*f[k];cost+=a.cost})});
  return{px,cg,cost,rev:px+cg,profit:px+cg-cost};
}
function viewFinance(){
  const t=weekTotals(),sp=SPEED,perHr=t.profit*(3600*30*sp/10080),perDay=perHr*24,tot=Math.max(1,t.rev);
  return `<div class="card hero"><div class="s">Estimated profit · real time</div><div class="row" style="margin-top:10px;align-items:flex-end"><div><div class="s">per hour</div><div class="num ${perHr>=0?'':'bad'}" style="font-size:28px;font-weight:700;letter-spacing:-.03em">${fmt(perHr)}</div></div><div style="text-align:right"><div class="s">per day</div><div class="num ${perDay>=0?'':'bad'}" style="font-size:28px;font-weight:700;letter-spacing:-.03em">${fmt(perDay)}</div></div></div><div class="s" style="margin-top:10px">With your current schedules · ${fmt(t.profit)} per game week · ${fmt(t.profit/7)} per game day</div></div>
  <div class="card"><div class="row"><b>Weekly breakdown</b><span class="s">game week</span></div>
   <div class="row" style="margin-top:12px"><span class="s">Passengers</span><b class="num">${fmt(t.px)}</b></div><div class="bar"><i style="width:${t.px/tot*100}%"></i></div>
   <div class="row" style="margin-top:10px"><span class="s">Cargo</span><b class="num">${fmt(t.cg)}</b></div><div class="bar"><i style="width:${t.cg/tot*100}%"></i></div>
   <div class="row" style="margin-top:10px"><span class="s">Operating cost</span><b class="num bad">−${fmt(t.cost)}</b></div><div class="bar"><i style="width:${Math.min(100,t.cost/tot*100)}%"></i></div></div>
  <div class="card" style="text-align:center;padding:22px 16px"><div class="s">Vault · uncollected earnings</div><div class="num" style="font-size:30px;font-weight:700;letter-spacing:-.03em;margin:4px 0 12px">${fmt(S.vault)}</div><button class="btn p" onclick="collect()" ${S.vault<=0?'disabled':''} style="width:100%;padding:11px">Collect ${fmt(S.vault)}</button></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="card"><div class="s">Total revenue</div><b class="num">${fmt(S.totalRevenue)}</b></div><div class="card"><div class="s">Cash</div><b class="num">${fmt(S.cash)}</b></div></div>`;
}
function collect(){if(S.vault<=0)return;S.cash+=S.vault;S.vault=0;render()}

// ==================== LOOP ====================
// The game is driven by real elapsed time, not by timer ticks, so it keeps up when the tab is hidden
// (browsers throttle timers) and catches up after the page was closed (offline progress, capped).
const CATCHUP_MS=6*3600e3;
let lastTs=Date.now(),carry=0,tickN=0;
function run(n,chunk){while(n>0){const st=Math.min(n,chunk);simulate(st);n-=st}}
// Whole weeks are fast-forwarded with the same allocation maths (one step per week instead of one per flight).
function fastWeek(){S.clock+=WEEK;const w=Math.floor(S.clock/WEEK),AC={},al=r=>AC[r.id]??=alloc(r);S.routes.forEach(r=>newWeek(r,w));
  S.planes.forEach(p=>p.sched.forEach(s=>{const r=route(s.rid),a=r&&al(r).out.get(s);if(a){const v=a.rev-a.cost;p.totalEarned=(p.totalEarned||0)+v;S.vault+=v;S.totalRevenue+=v;addStat(r.from,paxSum(a)*a.legs/2,paxSum(a)*a.legs/2,(a.pax.L+a.pax.M)*a.legs)}}))}
function advance(ms,chunk){
  carry+=ms/1000*30*SPEED;let left=Math.floor(carry);carry-=left;
  if(left>=2*WEEK){const pre=S.clock%WEEK?WEEK-S.clock%WEEK:0;run(pre,chunk);left-=pre;const wk=Math.floor(left/WEEK);for(let i=0;i<wk;i++)fastWeek();left-=wk*WEEK}
  run(left,chunk);
}
const fmtAway=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'};
function tick(){
  if(!window.READY)return;
  const now=Date.now(),dt=Math.max(0,Math.min(now-lastTs,CATCHUP_MS));lastTs=now;
  advance(dt,dt>3000?240:60);tickN++;
  if(tickN%4===0||dt>3000){S.history.nw.push(S.cash+S.vault);S.history.rev.push(S.totalRevenue);if(S.history.nw.length>240){S.history.nw.shift();S.history.rev.shift()}}
  if(document.hidden){if(tickN%40===0)save();return}
  head();
  const ae=document.activeElement,busy=$('#ov').classList.contains('show')||(ae&&/INPUT|SELECT/.test(ae.tagName))||(UI.page&&/^(open|buy|cfg|rot)$/.test(UI.page.t))||UI.tab==='buy'||document.querySelector('.dd.open');
  if(!busy&&(tickN%8===0||dt>3000))render();else if(tickN%20===0)save();
}
// A worker timer is not throttled like a hidden tab's setInterval, so the game keeps running in the background.
try{const w=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),500)'],{type:'text/javascript'})));w.onmessage=tick}catch(e){setInterval(tick,500)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{tick();render()}});
window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);

// ==================== BOOT ====================
async function boot(){
  try{
    const get=n=>fetch('data/'+n+'.json').then(r=>{if(!r.ok)throw 0;return r.json()});
    const [c,a,ac]=await Promise.all([get('countries'),get('airports'),get('aircraft')]);
    COUNTRIES=c;MAKERS=ac.makers;FAMILIES=ac.families;AIRCRAFT=ac.aircraft;AIRCRAFT.forEach(a=>{if(!a.cls)a.cls=a.seats<=80?'A':a.seats<=135?'B':a.seats<=260?'C':a.seats<=330?'D':a.seats<=400?'E':'F'});
    HUBS=a.map(x=>({id:x.code.toLowerCase(),code:x.code,icao:x.icao,demand:x.demand,city:x.city,iso:x.iso,lat:x.lat,lon:x.lon,price:x.hubPrice,cls:x.cls||'C',flag:((c.find(k=>k.iso===x.iso)||{}).flag)||flag(x.iso),country:(c.find(k=>k.iso===x.iso)||{}).name}))
      .sort((p,q)=>p.country.localeCompare(q.country)||p.city.localeCompare(q.city));
  }catch(e){$('#view').innerHTML=empty('Could not load the data files.<br>Serve this folder over http, e.g. <b>python3 -m http.server</b>, then open game.html.');return}
  load();if(!S.started){location.replace('index.html');return}
  window.READY=true;
  const away=S.savedAt?Date.now()-S.savedAt:0;let msg=null;
  if(away>30000){const ms=Math.min(away,CATCHUP_MS),before=S.cash+S.vault;advance(ms,240);S.history.nw.push(S.cash+S.vault);S.history.rev.push(S.totalRevenue);
    const g=S.cash+S.vault-before,gd=Math.floor(ms/1000*30*SPEED/1440);
    msg=`You were away ${fmtAway(away)}${away>CATCHUP_MS?' (only the first '+fmtAway(CATCHUP_MS)+' are simulated)':''}.\n${gd} game days passed and your fleet kept flying: ${g>=0?'+':'−'}${fmt(Math.abs(g))}.`}
  lastTs=Date.now();render();if(msg)info('Welcome back',msg);
}
boot();
</script>
</body>
